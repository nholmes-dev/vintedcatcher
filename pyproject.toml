[project]
name = "vinted-sniper"
version = "0.1.0"
description = "vinted listing monitor for buy-and-flip workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "azmogoo" }]
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
vinted-sniper = "vinted_sniper.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vinted_sniper*"]
